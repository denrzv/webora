name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    # Dependencies rot without any commit to trigger a scan.
    - cron: '0 6 * * 1'

jobs:
  deps-osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /usr/local/bin/osv-scanner" \
            | sha256sum --check
          chmod +x /usr/local/bin/osv-scanner
      - run: bash scripts/security-check.sh
