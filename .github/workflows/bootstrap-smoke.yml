name: Bootstrap smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate shell syntax
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/pre-commit-check.sh
      - name: Provision shared bootstrap
        run: WEBORA_BOOTSTRAP_PREPARE_GRADLE=0 bash scripts/bootstrap.sh
      - name: Verify guardrail tools
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks version
          shellcheck --version
          shellcheck scripts/*.sh
          gitleaks detect --source . --no-git --redact
