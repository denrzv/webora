name: Release debug APK

# Turns a commit into a downloadable APK.
#
# The build is a DEBUG build by decision (SCOPE-001): distribution is an APK handed to named people,
# not a Play listing, so signing configuration, R8 keep verification and store assets are all
# descoped. A debug build also carries DEVX-001's SiteSkin Inspector, which is useful when
# demonstrating what the browser decided about a manifest.
#
# Manual on purpose. A demo build is cut deliberately; a Release on every push is noise.
#
# NOTE ON SHARING: while denrzv/webora is private, GitHub serves release assets only to
# authenticated users with access to the repository — a friend clicking the link gets a 404, not a
# download. See docs/INSTALL.md for the options. This workflow is still worth having: it makes the
# artifact reproducible and removes "which machine built this" from the question.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Extra release notes (optional)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. versionCode is the commit count, and
      # actions/checkout defaults to a depth-1 clone where `git rev-list --count HEAD` returns 1 —
      # so with the default every release would ship versionCode 1 and Android would refuse to
      # install one demo build over another. Verified: a shallow clone of this repository counts 1
      # against 135 for a full one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately identical to the `android` job in ci.yml, so the build that ships is the build
      # CI proved. If that job's toolchain changes, this one has to change with it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # versionName is constant across demo builds, so the short SHA goes in the file name to tell
      # two APKs apart on disk. versionCode does move — it is the commit count — but it is only
      # visible once installed, which is no help when picking a file to send someone.
      - name: Name the artifact after its version and commit
        id: artifact
        run: |
          set -euo pipefail
          version="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          short="$(git rev-parse --short HEAD)"
          code="$(git rev-list --count HEAD)"
          src="app/build/outputs/apk/debug/app-debug.apk"

          # Guards the fetch-depth above. If this ever reads 1 on a repository with real history,
          # the checkout was shallow and every install-over-previous would be refused by Android.
          if [[ "${code}" -le 1 ]]; then
            echo "::error::versionCode resolved to ${code} — the checkout is shallow, see fetch-depth"
            exit 1
          fi

          # A Release with no asset is worse than no Release: the link exists and gives nothing.
          if [[ ! -f "${src}" ]]; then
            echo "::error::no APK at ${src}"
            exit 1
          fi

          name="webora-${version}-${short}-debug.apk"
          mv "${src}" "${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}-${short}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          ls -lh "${name}"

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          name: Webora ${{ steps.artifact.outputs.version }} (debug, ${{ github.sha }})
          files: ${{ steps.artifact.outputs.name }}
          fail_on_unmatched_files: true
          body: |
            Debug build of Webora for demonstration.

            **This is a debug build.** It is debuggable, signed with Android's default debug key, and
            includes the SiteSkin Integration Inspector. That is appropriate for a build handed to
            people you know and not for general distribution.

            - Application id `app.webora.browser.debug` — it will not collide with any future release
              build on the same device.
            - `versionCode` ${{ steps.artifact.outputs.code }}, derived from the commit count, so
              this installs over an earlier demo build instead of being refused.
            - Android 8.0 (API 26) or newer.
            - `INTERNET` is the only permission requested.

            Install instructions: [`docs/INSTALL.md`](../blob/main/docs/INSTALL.md).

            To see SiteSkin working, open the suggestion on the home screen — <https://denrzv.github.io>
            — and allow the branding when asked.

            ${{ inputs.notes }}
