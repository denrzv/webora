name: Android screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-screenshots
  cancel-in-progress: true

jobs:
  live-site:
    name: Bloom Flowers on Pixel 6 API 33
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize diagnostic artifact
        run: |
          mkdir -p artifacts/screenshots
          printf 'commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > artifacts/run.txt

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest currently ships several Android system images plus NDK/CMake.
      # This job is JVM-only and android-emulator-runner installs the exact API 33
      # image it needs, so remove the unused preinstalled payload before provisioning.
      - name: Free disk space for Android emulator
        run: |
          echo "=== Disk before Android SDK cleanup ==="
          df -h /
          du -sh "$ANDROID_HOME/system-images" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" \
            2>/dev/null || true

          sudo rm -rf "$ANDROID_HOME/system-images"
          sudo rm -rf "$ANDROID_HOME/ndk"
          sudo rm -rf "$ANDROID_HOME/cmake"

          echo "=== Disk after Android SDK cleanup ==="
          df -h /

      - name: Run live SiteSkin screenshot journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          system-image-api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-metrics
          pre-emulator-launch-script: |
            echo "=== Disk before emulator launch ==="
            df -h /
            du -sh "$ANDROID_AVD_HOME" 2>/dev/null || true
            du -sh "$ANDROID_HOME/system-images" 2>/dev/null || true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=app.webora.browser.visual.LiveSiteScreenshotTest \
              2>&1 | tee artifacts/instrumentation.txt
            test_status=${PIPESTATUS[0]}
            adb logcat -d > artifacts/logcat.txt
            adb pull \
              /sdcard/Android/data/app.webora.browser.debug/files/screenshots/. \
              artifacts/screenshots/ || true
            png_count=$(find artifacts/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
            printf 'test_status=%s\npng_count=%s\n' "$test_status" "$png_count" \
              | tee artifacts/result.txt
            if [[ "$png_count" -eq 0 ]]; then
              echo "No screenshots were produced" >&2
              exit 1
            fi
            exit "$test_status"

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webora-screenshots-api33-${{ github.sha }}
          path: |
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the evidence
        if: always()
        run: |
          {
            echo '## Webora live-site screenshots'
            echo
            echo "Origin: \`https://denrzv.github.io\`"
            echo 'Device: Pixel 6 profile, Android API 33'
            echo "Download the \`webora-screenshots-api33-*\` artifact from this run."
            echo
            if [[ -f artifacts/result.txt ]]; then
              echo '```text'
              cat artifacts/result.txt
              echo '```'
            else
              echo 'The emulator step ended before it could write a result summary.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
