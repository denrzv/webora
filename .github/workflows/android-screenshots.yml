name: Android screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "siteskin-core/**"
      - "evidence-sheet/**"
      - "scripts/android-screenshot-ci.sh"
      - "scripts/android-emulator-ready.sh"
      - "scripts/hosted-siteskin-preflight.py"
      - ".github/workflows/android-screenshots.yml"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

concurrency:
  group: android-screenshots
  cancel-in-progress: false

jobs:
  live-site:
    name: Bloom Flowers drawer on Pixel 6 API 33
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize diagnostic artifact
        run: |
          mkdir -p artifacts review
          printf 'commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > artifacts/run.txt

      - name: Verify deployed Bloom freshness and SiteSkin contract
        env:
          BLOOM_REPOSITORY_URL: https://github.com/denrzv/bloom-flowers.git
          BLOOM_MAIN_REF: refs/heads/main
          HOSTED_ORIGIN: https://denrzv.github.io
        run: |
          set -euo pipefail

          bloom_sha="$(
            git ls-remote "$BLOOM_REPOSITORY_URL" "$BLOOM_MAIN_REF" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$bloom_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve bloom-flowers@main to a commit SHA: '$bloom_sha'" >&2
            exit 1
          fi

          python3 scripts/hosted-siteskin-preflight.py \
            --origin "$HOSTED_ORIGIN" \
            --expected-source-sha "$bloom_sha" \
            --artifacts-dir artifacts

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for Android emulator
        run: |
          echo "=== Disk before Android SDK cleanup ==="
          df -h /
          du -sh "$ANDROID_HOME/system-images" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" \
            2>/dev/null || true

          sudo rm -rf "$ANDROID_HOME/system-images"
          sudo rm -rf "$ANDROID_HOME/ndk"
          sudo rm -rf "$ANDROID_HOME/cmake"

          echo "=== Disk after Android SDK cleanup ==="
          df -h /

      - name: Build the app and Android-test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run live SiteSkin drawer screenshot journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          system-image-api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-metrics
          pre-emulator-launch-script: |
            echo "=== Disk before emulator launch ==="
            df -h /
            du -sh "$ANDROID_AVD_HOME" 2>/dev/null || true
            du -sh "$ANDROID_HOME/system-images" 2>/dev/null || true
          script: READY_DEADLINE_SECONDS=300 bash scripts/android-screenshot-ci.sh

      - name: Compose the contact sheet
        if: always()
        run: |
          if [[ ! -f artifacts/result.txt ]]; then
            echo "No result.txt: the emulator step ended before it collected screenshots." >&2
            exit 0
          fi

          png_count=$(sed -n 's/^png_count=//p' artifacts/result.txt)
          if [[ "${png_count:-0}" -eq 0 ]]; then
            echo "No screenshots were collected; there is nothing to compose." >&2
            exit 0
          fi

          tiles=$(./gradlew --quiet :evidence-sheet:run --args="review" | sed -n 's/^tiles=//p')
          echo "composed tiles=${tiles} against png_count=${png_count}"

          if [[ "$tiles" != "$png_count" ]]; then
            echo "Contact sheet has ${tiles} tiles but the run collected ${png_count} screenshots." >&2
            echo "Refusing to publish a sheet that does not account for every frame." >&2
            exit 1
          fi

      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webora-screenshots-${{ github.sha }}
          path: review/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webora-screenshot-diagnostics-${{ github.sha }}
          path: |
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the evidence
        if: always()
        run: |
          png_count=0
          if [[ -f artifacts/result.txt ]]; then
            png_count=$(sed -n 's/^png_count=//p' artifacts/result.txt)
          fi

          {
            echo '## Webora live-site screenshots'
            echo
            echo "Origin: \`https://denrzv.github.io\`"
            echo 'SiteSkin presentation: **explicit drawer** with projected dock actions `catalog`, `cart`, `profile`'
            echo 'Drawer actions expected after projection: `home`, `call-shop`'
            echo 'Device: Pixel 6 profile, Android API 33'
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Run: \`$GITHUB_RUN_ID\`"
            echo "Screenshots captured: **${png_count:-0}**"

            if [[ -f artifacts/hosted-deployment-validation.txt ]]; then
              echo
              echo '### Hosted Bloom deployment freshness'
              echo '```text'
              cat artifacts/hosted-deployment-validation.txt
              echo '```'
            fi

            if [[ -f artifacts/hosted-siteskin-validation.txt ]]; then
              echo
              echo '### Hosted SiteSkin contract'
              echo '```text'
              cat artifacts/hosted-siteskin-validation.txt
              echo '```'
            fi

            echo
            if [[ "${png_count:-0}" -gt 0 ]]; then
              echo "| Artifact | Contents |"
              echo "|---|---|"
              echo "| \`webora-screenshots-$GITHUB_SHA\` | \`preview.png\` plus each full-resolution frame |"
              echo "| \`webora-screenshot-diagnostics-$GITHUB_SHA\` | deployment metadata, freshness/contract summaries, hosted manifest, logcat, instrumentation, readiness, test output |"
              echo
              echo 'Open `preview.png` first — it shows the whole journey in order.'
            else
              echo 'No screenshots were captured, so no screenshots artifact was produced.'
              echo "Diagnostics are in \`webora-screenshot-diagnostics-$GITHUB_SHA\`."
            fi
            echo
            if [[ -f artifacts/result.txt ]]; then
              echo '```text'
              cat artifacts/result.txt
              echo '```'
            else
              echo 'The emulator step ended before it could write a result summary.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
