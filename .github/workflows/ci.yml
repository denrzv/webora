name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install pre-commit
      - run: pre-commit run --all-files
      # scripts/pre-commit-check.sh is not what CI runs, so a gate wired only into that script runs
      # on developer machines and nowhere else. The emulator readiness gate decides when a hosted
      # screenshot run may start, and its verdict function is pure precisely so a machine with no
      # /dev/kvm can test it — which includes this one.
      - name: Emulator readiness gate self-test
        run: bash scripts/android-emulator-ready-selftest.sh

  core:
    # :siteskin-core must build and test with NO Android SDK. This job installs no
    # SDK on purpose — if a maintainer ever adds an Android dependency to core,
    # this job is what catches it, and the failure is unambiguous.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: siteskin-core tests (no Android SDK)
        env:
          ANDROID_HOME: ''
          ANDROID_SDK_ROOT: ''
        run: ./gradlew :siteskin-core:check :siteskin-lint:test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew test
      # `test` covers the debug variant only — AGP 9 creates no other host-test task —
      # so the developer inspector's absence from the shipped variants is asserted
      # against their compiled classes rather than by a JUnit run that cannot exist.
      - run: ./gradlew :app:assertInspectorAbsentFromReleaseVariants
      # assembleDebug is the task that actually runs D8. compileDebugKotlin passing
      # proves nothing about whether the chosen jvmTarget can be dexed.
      - run: ./gradlew :app:assembleDebug
      - run: ./gradlew :app:lintDebug

  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      # Unconditional. Never guard this behind a `tasks --all | grep detekt` check —
      # that pattern lets an unwired plugin masquerade as a passing gate.
      - run: ./gradlew detekt
