build:
  maxIssues: 0

config:
  validation: true
  # A deprecated rule name becomes a warning, and a warning becomes a build failure.
  # That is intentional: silently-ignored config is how a gate stops being a gate.
  warningsAsErrors: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 40
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  NestedBlockDepth:
    active: true
    threshold: 4
  # NOT `ComplexMethod` — that name is deprecated, and with warningsAsErrors it
  # fails the entire run rather than the rule.
  CyclomaticComplexMethod:
    active: true
    threshold: 10
  CognitiveComplexMethod:
    active: true
    threshold: 15
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20
    thresholdInEnums: 20

naming:
  active: true
  FunctionNaming:
    active: true
    # Compose requires PascalCase composables; without this every @Composable trips.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'TODOs must carry a ticket id.'
        value: 'TODO:'
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 4

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
    # ADR-010 requires every parse failure to end in regular browsing rather than an exception
    # reaching a navigation, so converting these two to a typed null/rejection at the boundary is
    # the mandated behaviour, not an oversight. They are the throws the JDK's URL primitives use to
    # say "malformed": java.net.IDN throws IllegalArgumentException for an empty or undecodable
    # label, java.net.URI throws URISyntaxException for a reference it cannot parse. Neither
    # carries anything a caller could act on beyond "no".
    #
    # Scoped deliberately: the rule stays on for every other exception type, so a swallowed
    # IOException or IllegalStateException still fails the build.
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'IllegalArgumentException'
      - 'URISyntaxException'

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

potential-bugs:
  active: true

performance:
  active: true
